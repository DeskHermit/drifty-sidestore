name: Update Telegram SideStore source

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-sidestore-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Sync Telegram files and source
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TG_GROUP_NAME: "drifty's megalomania"
          TG_TOPIC_NAME: "[IPA] Tweaked YouTube"
        run: python scripts/sync.py
      - name: Commit source and state if changed
        run: |
          if [ -n "$(git status --porcelain -- source.json ytlite.json ytkace.json youmod.json state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add source.json ytlite.json ytkace.json youmod.json state.json
            git commit -m "Update SideStore source from Telegram"
            git push
          fi
